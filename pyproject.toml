[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "denoising-pilot"
version = "0.1.0"
description = "Development-only CPU benchmark for controlled 1D denoising"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.12", "PyWavelets>=1.5", "torch>=2.2"]

[project.scripts]
denoising-pilot = "denoising.cli:main"

[tool.setuptools.packages.find]
include = ["denoising*"]
